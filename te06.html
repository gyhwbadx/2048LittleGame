<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>

<!-- 主题只按系统偏好初始化一次，不保存 -->
<script>
(function () {
  var t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
  :root {
    /* 整体尺寸：像素上限 550px（原 440px 的 125%） */
    --size: min(92vw, 80vh, 550px);

    /* ---------- 浅色主题（默认） ---------- */
    --page-bg:      #faf8ef;
    --text:         #776e65;
    --text-dim:     #9c8e82;
    --board-bg:     #bbada0;
    --cell-bg:      rgba(238, 228, 218, 0.35);
    --score-bg:     #bbada0;
    --score-label:  #eee4da;
    --score-value:  #ffffff;
    --btn-bg:       #8f7a66;
    --btn-bg-hover: #9f8b77;
    --btn-text:     #f9f6f2;
    --overlay-bg:   rgba(238, 228, 218, 0.78);
    --overlay-text: #776e65;
    --overlay-sub:  #8f7a66;

    --modal-mask:   rgba(0, 0, 0, 0.45);
    --modal-bg:     #faf8ef;
    --modal-text:   #776e65;
  }

  /* ---------- 深色主题 ---------- */
  :root[data-theme="dark"] {
    --page-bg:      #15151a;
    --text:         #e8e0d8;
    --text-dim:     #9a8f86;
    --board-bg:     #332f2c;
    --cell-bg:      rgba(255, 255, 255, 0.07);
    --score-bg:     #332f2c;
    --score-label:  #b9ada2;
    --score-value:  #f0e9e2;
    --btn-bg:       #5c5248;
    --btn-bg-hover: #6d6154;
    --btn-text:     #f2ece6;
    --overlay-bg:   rgba(22, 20, 19, 0.82);
    --overlay-text: #f0e9e2;
    --overlay-sub:  #b9ada2;

    --modal-mask:   rgba(0, 0, 0, 0.68);
    --modal-bg:     #232128;
    --modal-text:   #e8e0d8;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: background-color .28s ease, color .28s ease;
  }

  .game {
    width: var(--size);
    display: flex;
    flex-direction: column;
    gap: calc(var(--size) * 0.028);
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
  }

  h1 {
    margin: 0;
    font-size: calc(var(--size) * 0.125);
    line-height: 0.9;
    letter-spacing: -2px;
  }

  .scores { display: flex; gap: calc(var(--size) * 0.018); }

  .score-box {
    background: var(--score-bg);
    border-radius: calc(var(--size) * 0.014);
    padding: calc(var(--size) * 0.012) calc(var(--size) * 0.03);
    text-align: center;
    min-width: calc(var(--size) * 0.18);
    transition: background-color .28s ease;
  }
  .score-box .label {
    font-size: calc(var(--size) * 0.026);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--score-label);
    transition: color .28s ease;
  }
  .score-box .value {
    font-size: calc(var(--size) * 0.046);
    font-weight: 700;
    color: var(--score-value);
    line-height: 1.25;
    transition: color .28s ease;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .hint {
    margin: 0;
    font-size: calc(var(--size) * 0.028);
    color: var(--text-dim);
    transition: color .28s ease;
  }
  .controls { display: flex; gap: calc(var(--size) * 0.018); }

  button {
    font-family: inherit;
    font-size: calc(var(--size) * 0.03);
    font-weight: 700;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: none;
    border-radius: calc(var(--size) * 0.014);
    padding: calc(var(--size) * 0.02) calc(var(--size) * 0.038);
    cursor: pointer;
    transition: background-color .15s, opacity .15s, color .28s ease,
                transform .12s ease;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--btn-bg-hover); }
  button:active:not(:disabled) { transform: scale(0.95); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #themeBtn {
    padding-left:  calc(var(--size) * 0.026);
    padding-right: calc(var(--size) * 0.026);
    font-size: calc(var(--size) * 0.032);
    line-height: 1;
  }

  /* ============================================================
     棋盘
     ============================================================ */
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border-radius: calc(var(--size) * 0.022);
    transition: background-color .28s ease;
    overflow: hidden;
  }

  .grid-bg {
    position: absolute;
    inset: calc(var(--size) * 0.026);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: calc(var(--size) * 0.026);
  }

  .grid-bg .cell {
    background: var(--cell-bg);
    border-radius: calc(var(--size) * 0.014);
    transition: background-color .28s ease;
  }

  .tile-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* 外层：只负责平移定位 */
  .tile {
    position: absolute;
    left: 0;
    top: 0;
    transition: transform .12s ease-in-out;
    will-change: transform;
  }

  /* 内层：负责颜色、字体与缩放动画 */
  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: calc(var(--size) * 0.014);
    font-weight: 700;
    line-height: 1;
    color: #776e65;
  }

  .tile-inner.len1 { font-size: calc(var(--size) * 0.105); }
  .tile-inner.len2 { font-size: calc(var(--size) * 0.095); }
  .tile-inner.len3 { font-size: calc(var(--size) * 0.078); }
  .tile-inner.len4 { font-size: calc(var(--size) * 0.062); }
  .tile-inner.len5 { font-size: calc(var(--size) * 0.050); }
  .tile-inner.len6 { font-size: calc(var(--size) * 0.042); }

  .tile-inner.v2    { background: #eee4da; }
  .tile-inner.v4    { background: #ede0c8; }
  .tile-inner.v8    { background: #f2b179; color: #f9f6f2; }
  .tile-inner.v16   { background: #f59563; color: #f9f6f2; }
  .tile-inner.v32   { background: #f67c5f; color: #f9f6f2; }
  .tile-inner.v64   { background: #f65e3b; color: #f9f6f2; }
  .tile-inner.v128  { background: #edcf72; color: #f9f6f2; }
  .tile-inner.v256  { background: #edcc61; color: #f9f6f2; }
  .tile-inner.v512  { background: #edc850; color: #f9f6f2; }
  .tile-inner.v1024 { background: #edc53f; color: #f9f6f2; }
  .tile-inner.v2048 { background: #edc22e; color: #f9f6f2; }
  .tile-inner.vsuper{ background: #3c3a32; color: #f9f6f2; }

  /* 新方块出现 */
  @keyframes tile-spawn {
    0%   { transform: scale(0);   opacity: 0; }
    60%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .tile-inner.spawn { animation: tile-spawn .18s ease-out; }

  /* 合并弹一下 */
  @keyframes tile-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .tile-inner.pop { animation: tile-pop .18s ease-out; }

  /* resize 时临时禁用过渡 */
  .no-transition .tile { transition: none !important; }

  /* ============================================================
     胜负遮罩
     ============================================================ */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--overlay-bg);
    border-radius: calc(var(--size) * 0.022);
    font-size: calc(var(--size) * 0.075);
    font-weight: 700;
    color: var(--overlay-text);
    line-height: 1.5;
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease,
                background-color .28s ease, color .28s ease;
    z-index: 10;
    pointer-events: none;
    transform: scale(0.96);
  }
  .overlay.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }
  .overlay span {
    display: block;
    font-size: calc(var(--size) * 0.032);
    font-weight: 500;
    color: var(--overlay-sub);
    transition: color .28s ease;
  }

  /* ============================================================
     确认弹窗
     ============================================================ */
  .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--modal-mask);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility .22s ease,
                background-color .28s ease;
  }
  .modal.show {
    opacity: 1;
    visibility: visible;
  }

  .modal-box {
    background: var(--modal-bg);
    color: var(--modal-text);
    border-radius: calc(var(--size) * 0.022);
    padding: calc(var(--size) * 0.05) calc(var(--size) * 0.06);
    min-width: 60%;
    max-width: 85%;
    text-align: center;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
    transition: background-color .28s ease, color .28s ease;

    transform: scale(0.82) translateY(14px);
    opacity: 0;
    transition: transform .26s cubic-bezier(.34, 1.56, .64, 1),
                opacity .2s ease,
                background-color .28s ease,
                color .28s ease;
  }
  .modal.show .modal-box {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-box p {
    margin: 0 0 calc(var(--size) * 0.045);
    font-size: calc(var(--size) * 0.045);
    font-weight: 700;
    line-height: 1.4;
  }
  .modal-box .sub {
    display: block;
    margin-top: calc(var(--size) * 0.012);
    font-size: calc(var(--size) * 0.026);
    font-weight: 400;
    color: var(--text-dim);
  }
  .modal-actions {
    display: flex;
    gap: calc(var(--size) * 0.025);
    justify-content: center;
  }
  .modal-actions button {
    font-size: calc(var(--size) * 0.032);
    padding: calc(var(--size) * 0.02) calc(var(--size) * 0.05);
    min-width: 30%;
  }
  .modal-actions .confirm-yes { background: #f65e3b; }
  .modal-actions .confirm-yes:hover { background: #e04e2b; }
  .modal-actions .confirm-no  { background: var(--btn-bg); }
  .modal-actions .confirm-no:hover { background: var(--btn-bg-hover); }
</style>
</head>
<body>

<div class="game">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="bar">
    <p class="hint">用方向键 ↑ ↓ ← → 移动</p>
    <div class="controls">
      <button id="undoBtn"  type="button">撤回</button>
      <button id="newBtn"   type="button">新游戏</button>
      <button id="themeBtn" type="button" aria-label="切换深色模式" title="切换深色模式">🌙</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay"></div>
  </div>
</div>

<!-- 新游戏确认弹窗 -->
<div class="modal" id="confirmModal">
  <div class="modal-box">
    <p>
      确定要开始新游戏吗？
      <span class="sub">当前进度将会丢失</span>
    </p>
    <div class="modal-actions">
      <button class="confirm-yes" id="confirmYes" type="button">确定</button>
      <button class="confirm-no"  id="confirmNo"  type="button">取消</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var ANIM_MS = 120;                    // 与 CSS .tile transition 时长一致
  var KEY_DIR = {
    ArrowUp: 'up',
    ArrowDown: 'down',
    ArrowLeft: 'left',
    ArrowRight: 'right'
  };

  var boardEl      = document.getElementById('board');
  var gridBg       = document.getElementById('gridBg');
  var tileLayer    = document.getElementById('tileLayer');
  var overlayEl    = document.getElementById('overlay');
  var scoreEl      = document.getElementById('score');
  var bestEl       = document.getElementById('best');
  var undoBtn      = document.getElementById('undoBtn');
  var newBtn       = document.getElementById('newBtn');
  var themeBtn     = document.getElementById('themeBtn');
  var confirmModal = document.getElementById('confirmModal');
  var confirmYes   = document.getElementById('confirmYes');
  var confirmNo    = document.getElementById('confirmNo');

  /* 生成 16 个背景格子 */
  for (var i = 0; i < SIZE * SIZE; i++) {
    var cellEl = document.createElement('div');
    cellEl.className = 'cell';
    gridBg.appendChild(cellEl);
  }

  /* ============================================================
     主题
     ============================================================ */
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var isDark = theme === 'dark';
    themeBtn.textContent = isDark ? '☀️' : '🌙';
    var label = isDark ? '切换浅色模式' : '切换深色模式';
    themeBtn.setAttribute('aria-label', label);
    themeBtn.title = label;
  }

  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    themeBtn.blur();
  });

  applyTheme(currentTheme());

  /* ============================================================
     布局测量
     ============================================================ */
  var layout = { w: 0, pad: 0, gap: 0, cell: 0 };

  function measureLayout() {
    var w = boardEl.clientWidth || 400;
    var pad = w * 0.026;
    var gap = w * 0.026;
    var cell = (w - 2 * pad - 3 * gap) / 4;
    layout = { w: w, pad: pad, gap: gap, cell: cell };
  }

  function tilePos(r, c) {
    return {
      x: layout.pad + c * (layout.cell + layout.gap),
      y: layout.pad + r * (layout.cell + layout.gap)
    };
  }

  /* ============================================================
     状态（仅内存，刷新即重置）
     ============================================================ */
  var grid = emptyGrid();
  var tiles = [];                       // 活跃方块对象列表
  var score = 0;
  var best = 0;
  var history = [];                     // 撤回栈
  var gameOver = false;
  var won = false;
  var winOverlayShown = false;
  var animating = false;
  var pendingDir = null;                // 动画期间按下的方向

  /* ============================================================
     工具
     ============================================================ */
  function emptyGrid() {
    return Array.from({ length: SIZE }, function () {
      return new Array(SIZE).fill(0);
    });
  }

  function valueClass(v) {
    return v > 2048 ? 'vsuper' : 'v' + v;
  }

  function lenClass(v) {
    return 'len' + Math.min(String(v).length, 6);
  }

  /* ============================================================
     方块创建 / 更新
     ============================================================ */
  function makeTile(value, r, c, spawn) {
    var el = document.createElement('div');
    el.className = 'tile';
    el.style.width = layout.cell + 'px';
    el.style.height = layout.cell + 'px';

    var inner = document.createElement('div');
    inner.className = 'tile-inner ' + valueClass(value) + ' ' + lenClass(value);
    inner.textContent = value;
    if (spawn) inner.classList.add('spawn');

    el.appendChild(inner);

    var p = tilePos(r, c);
    el.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px)';

    tileLayer.appendChild(el);

    return { el: el, inner: inner, value: value, r: r, c: c };
  }

  function applyTileLayout(t) {
    t.el.style.width = layout.cell + 'px';
    t.el.style.height = layout.cell + 'px';
    var p = tilePos(t.r, t.c);
    t.el.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px)';
  }

  function updateTileFace(t, animate) {
    t.inner.textContent = t.value;
    t.inner.className = 'tile-inner ' + valueClass(t.value) + ' ' + lenClass(t.value);
    if (animate) {
      void t.inner.offsetWidth;         // 强制重排，重新触发动画
      t.inner.classList.add('pop');
    }
  }

  function moveTileEl(t, r, c) {
    var p = tilePos(r, c);
    t.el.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px)';
  }

  /* ============================================================
     渲染 / 重建
     ============================================================ */
  function rebuildAll() {
    tileLayer.innerHTML = '';
    tiles = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] !== 0) {
          tiles.push(makeTile(grid[r][c], r, c, false));
        }
      }
    }
  }

  function updateScore() {
    if (score > best) best = score;
    scoreEl.textContent = score;
    bestEl.textContent = best;
    undoBtn.disabled = history.length === 0;
  }

  function showOverlay(html) {
    overlayEl.innerHTML = html;
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  /* ============================================================
     新增随机方块
     ============================================================ */
  function addRandomTile() {
    var empty = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) empty.push({ r: r, c: c });
      }
    }
    if (empty.length === 0) return;

    var pos = empty[Math.floor(Math.random() * empty.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    grid[pos.r][pos.c] = value;
    tiles.push(makeTile(value, pos.r, pos.c, true));
  }

  /* ============================================================
     方向线坐标（从目标端开始）
     ============================================================ */
  function lineCoords(dir, index) {
    var coords = [];
    for (var i = 0; i < SIZE; i++) {
      if (dir === 'left')       coords.push({ r: index, c: i });
      else if (dir === 'right') coords.push({ r: index, c: SIZE - 1 - i });
      else if (dir === 'up')    coords.push({ r: i, c: index });
      else                      coords.push({ r: SIZE - 1 - i, c: index });
    }
    return coords;
  }

  /* ============================================================
     移动
     ============================================================ */
  function tryMove(dir) {
    if (gameOver) return;
    if (animating) { pendingDir = dir; return; }
    doMove(dir);
  }

  function doMove(dir) {
    /* 建立位置矩阵 */
    var mat = emptyGrid();
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      t.removed = false;
      t.merge = false;
      t.needPop = false;
      mat[t.r][t.c] = t;
    }

    var toRemove = [];

    /* 逐条线规划 */
    for (var line = 0; line < SIZE; line++) {
      var coords = lineCoords(dir, line);
      var lineTiles = [];
      for (var k = 0; k < SIZE; k++) {
        var tt = mat[coords[k].r][coords[k].c];
        if (tt) lineTiles.push(tt);
      }

      var targetIdx = 0;
      var i2 = 0;
      while (i2 < lineTiles.length) {
        var cur = lineTiles[i2];
        var dest = coords[targetIdx];

        if (i2 + 1 < lineTiles.length && lineTiles[i2 + 1].value === cur.value) {
          var other = lineTiles[i2 + 1];
          cur.newR = dest.r;  cur.newC = dest.c;
          other.newR = dest.r; other.newC = dest.c;
          other.removed = true;
          cur.merge = true;
          toRemove.push(other);
          i2 += 2;
        } else {
          cur.newR = dest.r;  cur.newC = dest.c;
          i2 += 1;
        }
        targetIdx++;
      }
    }

    /* 是否发生了有效移动 */
    var anyMoved = false;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.removed) { anyMoved = true; continue; }
      if (t.newR !== t.r || t.newC !== t.c) anyMoved = true;
      if (t.merge) anyMoved = true;
    }
    if (!anyMoved) return;

    /* 保存撤回点 */
    history.push({
      grid: grid.map(function (row) { return row.slice(); }),
      score: score,
      won: won
    });
    if (history.length > 200) history.shift();

    /* 更新逻辑状态 */
    var gained = 0;
    var newGrid = emptyGrid();
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.removed) continue;
      if (t.merge) {
        t.value *= 2;
        gained += t.value;
        t.merge = false;
        t.needPop = true;
      }
      newGrid[t.newR][t.newC] = t.value;
      t.r = t.newR;
      t.c = t.newC;
    }
    grid = newGrid;
    score += gained;

    /* 触发滑动动画 */
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      moveTileEl(t, t.newR, t.newC);
      t.el.style.zIndex = t.removed ? 1 : 2;
    }

    updateScore();
    animating = true;

    /* 动画结束后清理 + 生成新方块 */
    setTimeout(function () {
      for (var i = 0; i < toRemove.length; i++) {
        var rm = toRemove[i];
        if (rm.el.parentNode) rm.el.parentNode.removeChild(rm.el);
        var idx = tiles.indexOf(rm);
        if (idx !== -1) tiles.splice(idx, 1);
      }

      for (var i = 0; i < tiles.length; i++) {
        var t = tiles[i];
        if (t.needPop) {
          t.needPop = false;
          updateTileFace(t, true);
        }
      }

      addRandomTile();

      animating = false;
      checkState();

      /* 处理动画期间排队的按键 */
      if (pendingDir && !gameOver) {
        var d = pendingDir;
        pendingDir = null;
        tryMove(d);
      } else {
        pendingDir = null;
      }
    }, ANIM_MS);
  }

  /* ============================================================
     状态检查
     ============================================================ */
  function canMove() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function checkState() {
    if (!won) {
      var reached = false;
      outer:
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          if (grid[r][c] >= 2048) { reached = true; break outer; }
        }
      }
      if (reached) {
        won = true;
        winOverlayShown = true;
        showOverlay('🎉 达成 2048！<span>按方向键继续</span>');
      }
    }

    if (!canMove()) {
      gameOver = true;
      winOverlayShown = false;
      showOverlay('游戏结束<span>得分 ' + score + '</span>');
    }
  }

  /* ============================================================
     撤回
     ============================================================ */
  function undo() {
    if (animating) return;
    if (history.length === 0) return;

    var s = history.pop();
    grid = s.grid.map(function (row) { return row.slice(); });
    score = s.score;
    won = s.won;
    gameOver = false;
    winOverlayShown = false;

    hideOverlay();
    rebuildAll();
    updateScore();
  }

  /* ============================================================
     新游戏
     ============================================================ */
  function newGame() {
    grid = emptyGrid();
    score = 0;
    history = [];
    gameOver = false;
    won = false;
    winOverlayShown = false;
    animating = false;
    pendingDir = null;

    hideOverlay();
    tileLayer.innerHTML = '';
    tiles = [];

    updateScore();

    addRandomTile();
    addRandomTile();
  }

  /* ============================================================
     确认弹窗
     ============================================================ */
  function openConfirmModal() {
    confirmModal.classList.add('show');
  }

  function closeConfirmModal() {
    confirmModal.classList.remove('show');
  }

  newBtn.addEventListener('click', function () {
    openConfirmModal();
    newBtn.blur();
  });

  confirmYes.addEventListener('click', function () {
    closeConfirmModal();
    newGame();
  });

  confirmNo.addEventListener('click', function () {
    closeConfirmModal();
  });

  confirmModal.addEventListener('click', function (e) {
    if (e.target === confirmModal) closeConfirmModal();
  });

  /* ============================================================
     键盘
     ============================================================ */
  window.addEventListener('keydown', function (e) {
    /* 弹窗打开时：ESC 关闭，其他按键拦截 */
    if (confirmModal.classList.contains('show')) {
      e.preventDefault();
      if (e.key === 'Escape') closeConfirmModal();
      return;
    }

    var dir = KEY_DIR[e.key];
    if (!dir) return;
    e.preventDefault();

    if (winOverlayShown) {
      winOverlayShown = false;
      hideOverlay();
      return;
    }
    if (gameOver) return;

    tryMove(dir);
  }, { passive: false });

  /* ============================================================
     撤回按钮
     ============================================================ */
  undoBtn.addEventListener('click', function () {
    undo();
    undoBtn.blur();
  });

  /* ============================================================
     窗口尺寸变化
     ============================================================ */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      measureLayout();
      tileLayer.classList.add('no-transition');
      for (var i = 0; i < tiles.length; i++) {
        applyTileLayout(tiles[i]);
      }
      void tileLayer.offsetWidth;
      tileLayer.classList.remove('no-transition');
    }, 120);
  });

  /* ============================================================
     启动
     ============================================================ */
  requestAnimationFrame(function () {
    measureLayout();
    newGame();
  });
})();
</script>
</body>
